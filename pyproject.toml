readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohappyeyeballs==2.6.1",
    "aiohttp==3.13.5",
    "aiosignal==1.4.0",
    "attrs==26.1.0",
    "dotenv>=0.9.9",
    "frozenlist==1.8.0",
    "greenlet==3.5.0",
    "idna==3.15",
    "iniconfig==2.3.0",
    "multidict==6.7.1",
    "packaging==26.2",
    "playwright==1.59.0",
    "pluggy==1.6.0",
    "propcache==0.5.2",
    "pyee==13.0.1",
    "pygments==2.20.0",
    "pytest==9.0.3",
    "ruff==0.15.14",
    "tenacity==9.1.4",
    "typing-extensions==4.15.0",
    "yarl==1.23.0",
]
